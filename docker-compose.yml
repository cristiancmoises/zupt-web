#
# Run:    docker compose up -d
# Stop:   docker compose down
# Logs:   docker compose logs -f
# Open:   http://localhost:8181
services:
  vaptvupt:
    build:
      context: .
      network: host
    image: vaptvupt-web:5.2.1
    container_name: vaptvupt-web
    pull_policy: build       # never try to pull from a registry; build locally
    ports:
      - "8181:8080"
    restart: unless-stopped

    # ─── Security ───
    # Practical defence-in-depth: the Python app is already run as
    # uid 1001 (vaptvupt) inside the container, so privilege escalation
    # via container processes requires both a kernel exploit and a
    # capability that no-new-privileges blocks.
    security_opt:
      - no-new-privileges:true

    # tmpfs for the work dir so compress jobs never touch the container's
    # writable layer (faster, and makes job cleanup atomic on restart).
    tmpfs:
      - /tmp/vaptvupt-work:size=2G,mode=700,uid=1001,gid=1001

    # ─── Resource limits ───
    # CPU is unconstrained by default — compression scales naturally
    # with available cores. Memory is capped at 4 GiB to bound the
    # worst-case compress job's RSS.
    # If you want to also cap CPU, uncomment 'cpus:' below; the value
    # MUST NOT exceed the cores available to the Docker daemon (e.g. on
    # a 2-core host, "cpus: 2.0" is the maximum).
    deploy:
      resources:
        limits:
          # cpus: "4.0"
          memory: 4G
        reservations:
          memory: 256M

    # ─── Logging hygiene ───
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
