#
# nginx site config for zupt-web. Sits in front of gunicorn on
# 127.0.0.1:5000 and serves /static/ directly.

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    # Tokens & info disclosure
    server_tokens off;

    # Body size: aligned with app.py's MAX_CONTENT_LENGTH (default 2 GiB).
    # Override both if you need to tighten or relax (see README §Tuning).
    client_max_body_size 2G;
    client_body_timeout 300s;
    client_header_timeout 60s;
    send_timeout 300s;

    # Gunicorn upstream timeouts (aligned with COMPRESS/EXTRACT_TIMEOUT
    # in app.py — both are 600s by default).
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_connect_timeout 30s;

    # ─── Security headers (set on every response) ───
    add_header X-Content-Type-Options          "nosniff"                                                                  always;
    add_header X-Frame-Options                 "DENY"                                                                     always;
    add_header X-XSS-Protection                "1; mode=block"                                                            always;
    add_header Referrer-Policy                 "no-referrer"                                                              always;
    add_header Permissions-Policy              "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy      "same-origin"                                                              always;
    add_header Cross-Origin-Resource-Policy    "same-origin"                                                              always;
    # Tight CSP. inline-style/script kept because the templates are
    # single-file by design (no separate .js/.css file). External
    # font origin is the only cross-origin allowance.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; connect-src 'self'" always;

    # ─── Compression of small text responses ───
    # Skip large bodies (binary archives don't recompress well and the
    # CPU cost would slow downloads).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript text/xml
        application/javascript application/json application/xml
        image/svg+xml;
    gzip_disable "msie6";

    # Faster file send-down (sendfile + tcp_nopush)
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # ─── Static files (logos, favicon) ───
    location /static/ {
        alias /opt/zupt/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable, max-age=2592000";
    }

    # ─── Liveness probe (unauthenticated, no rate limit) ───
    # Unbuffered, very short timeout — used by the Docker HEALTHCHECK.
    location = /healthz {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        access_log off;
    }

    # ─── App ───
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # Stream uploads instead of buffering them on disk first
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # ─── Block dotfiles & VCS ───
    location ~ /\.        { deny all; access_log off; log_not_found off; }
    location ~ /\.git     { deny all; access_log off; log_not_found off; }
    location ~ /\.env     { deny all; access_log off; log_not_found off; }
}
