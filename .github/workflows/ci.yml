name: CI

on:
  push:
    branches: [main, '5.2.13']
  pull_request:
    branches: [main, '5.2.13']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Historical immutable vendor regression tags.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install hash-locked runtime dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
      - name: Unit and route tests
        run: python -m unittest discover -s tests -v
      - name: Static syntax and shell checks
        run: |
          python -m py_compile app.py verify-vendor.py tests/test_app.py tests/test_build_zupt.py tests/live_smoke.py tests/test_vendor_manifest.py tests/test_version_boundaries.py
          shellcheck setup.sh build-zupt.sh
          bash -n setup.sh
          sh -n build-zupt.sh
      - name: Validate Compose model
        run: docker compose config --quiet

  bundled-zupt:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: zupt-5.2.10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install source-audit toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file libarchive-tools python3 unzip
      - name: Verify source-only boundary
        run: |
          ../build-zupt.sh --verify-only
      - name: Build and run downstream gate
        run: |
          make clean
          make -j2 WITH_SDK=0 WITH_PQBOX=0 V=1
          make WITH_SDK=0 WITH_PQBOX=0 check
      - name: Run extended and in-tree SDK tests
        run: |
          make WITH_SDK=0 WITH_PQBOX=0 test-all
          make sdk-test
          make audit-licenses
      - name: Execute sanitizer smoke
        run: make WITH_SDK=0 WITH_PQBOX=0 test-asan-run
      - name: Test installed-file contract
        run: bash scripts/test-installed-zupt.sh ./zupt

  image:
    needs: [web, bundled-zupt]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image with source-package extraction permissions
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          context=$(mktemp -d "$RUNNER_TEMP/zupt-web-context.XXXXXXXX")
          trap 'rm -rf -- "$context"' EXIT
          git ls-files -z |
            tar --null --no-recursion --files-from=- --create --file=- |
            tar --extract --file=- --directory="$context"
          find "$context" -type f -exec chmod 0600 {} +
          find "$context" -type d -exec chmod 0700 {} +
          chmod u+x "$context/setup.sh" "$context/build-zupt.sh" \
            "$context/zupt-5.2.10/scripts/check-source-only.sh"
          docker build --build-arg VCS_REF="$GITHUB_SHA" --tag zupt-web:5.2.13 "$context"
      - name: Verify final-image inventory
        run: |
          docker run --rm zupt-web:5.2.13 zupt version
          test "$(docker run --rm --entrypoint id zupt-web:5.2.13 -u)" = 1001
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' zupt-web:5.2.13)" = "$GITHUB_SHA"
          test "$(docker image inspect --format '{{ index .Config.Labels "io.zupt.core.revision" }}' zupt-web:5.2.13)" = 0165fbd78faf78046d49e004622820ef79061f17
          docker run --rm --user 0:0 --entrypoint find zupt-web:5.2.13 \
            /opt/zupt/app.py /opt/zupt/templates /opt/zupt/static \
            /usr/share/licenses/zupt /usr/share/licenses/zupt-web -type f -print
          docker run --rm --interactive --user 1001:1001 --entrypoint sh zupt-web:5.2.13 -se <<'READABILITY'
          test "$(id -u)" = 1001
          if ! test -r /opt/zupt/app.py; then
            echo 'Unreadable public runtime file: /opt/zupt/app.py' >&2
            exit 1
          fi
          for name in LICENSE LICENSE-AGPL-3.0 LICENSE-GPL-3.0 LICENSE-BSD-2-Clause LICENSE-BSD-3-Clause LICENSE-CC0-1.0 LICENSE-COMMERCIAL NOTICE THIRD-PARTY-NOTICES.md; do
            test -s "/usr/share/licenses/zupt/$name"
            test -r "/usr/share/licenses/zupt/$name"
          done
          test -s /usr/share/licenses/zupt-web/LICENSE
          test -r /usr/share/licenses/zupt-web/LICENSE
          find /opt/zupt/app.py /opt/zupt/templates /opt/zupt/static \
            /usr/share/licenses/zupt /usr/share/licenses/zupt-web \
            -type f -exec sh -ec '
              for path do
                if ! test -r "$path"; then
                  printf "Unreadable public runtime file: %s\n" "$path" >&2
                  exit 1
                fi
              done
            ' sh {} +
          READABILITY
          if docker run --rm --entrypoint sh zupt-web:5.2.13 -c 'command -v pip || command -v gcc || command -v make'; then
            echo 'forbidden build tool found in runtime image' >&2
            exit 1
          fi
      - name: Live HTTP route and crypto-mode matrix
        run: |
          docker run --detach --name zupt-web-ci \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --memory 4g --pids-limit 256 \
            --tmpfs /tmp/zupt-work:size=2G,mode=700,uid=1001,gid=1001 \
            --publish 127.0.0.1:8181:8080 zupt-web:5.2.13
          trap 'docker logs zupt-web-ci; docker rm --force zupt-web-ci' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8181/healthz >/dev/null; then
              break
            fi
            test "$attempt" -lt 60
            sleep 1
          done
          python3 tests/live_smoke.py
          job_count=$(docker exec zupt-web-ci sh -c \
            'find /tmp/zupt-work -mindepth 1 -maxdepth 1 -type d | wc -l')
          test "$job_count" = 2
          log_file="$RUNNER_TEMP/zupt-web-ci.log"
          if ! docker logs zupt-web-ci >"$log_file" 2>&1; then
            cat "$log_file" >&2
            echo 'could not collect container logs' >&2
            exit 1
          fi
          if grep --fixed-strings 'Control server error:' "$log_file"; then
            echo 'Gunicorn control server failed' >&2
            exit 1
          else
            test "$?" -eq 1
          fi
      - name: Export the tested image and source revision
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir image-export
          docker image save --output image-export/zupt-web-5.2.13.docker.tar zupt-web:5.2.13
          docker image inspect zupt-web:5.2.13 > image-export/image-inspect.json
          printf '%s\n' "$GITHUB_SHA" > image-export/COMMIT
          (
            cd image-export
            sha256sum zupt-web-5.2.13.docker.tar image-inspect.json COMMIT > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )
      - name: Retain the qualified image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zupt-web-5.2.13-${{ github.sha }}
          path: image-export/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
